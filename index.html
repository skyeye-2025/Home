<script>
    // ========== 三行打字机效果 ==========
    const lines = [
        { el: document.getElementById('t1'), cursor: document.getElementById('c1'), text: 'WELCOME TO' },
        { el: document.getElementById('t2'), cursor: document.getElementById('c2'), text: "SKYEYE'S" },
        { el: document.getElementById('t3'), cursor: document.getElementById('c3'), text: 'HOMEPAGE' }
    ];
    let lineIdx = 0;
    let charIdx = 0;
    const typeSpeed = 130;
    const linePause = 400;

    function typeNext() {
        if (lineIdx >= lines.length) return;
        const line = lines[lineIdx];
        line.cursor.classList.remove('hidden');

        if (charIdx < line.text.length) {
            line.el.textContent += line.text[charIdx];
            charIdx++;
            setTimeout(typeNext, typeSpeed);
        } else {
            line.cursor.classList.add('done');
            lineIdx++;
            charIdx = 0;
            if (lineIdx < lines.length) {
                setTimeout(typeNext, linePause);
            }
        }
    }

    // ========== Intersection Observer 滚动动画 ==========
    const sections = document.querySelectorAll('.sky-section');
    const dots = document.querySelectorAll('.nav-dot');

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            const section = entry.target;
            if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
                section.classList.add('visible');
                section.classList.remove('fading');
                const id = section.id;
                dots.forEach(d => {
                    d.classList.toggle('active', d.dataset.target === id);
                });
            } else if (!entry.isIntersecting) {
                section.classList.remove('visible');
                section.classList.add('fading');
            }
        });
    }, { threshold: [0.5] });

    sections.forEach(s => observer.observe(s));

    // ========== 导航点点击 ==========
    dots.forEach(dot => {
        dot.addEventListener('click', () => {
            const target = document.getElementById(dot.dataset.target);
            if (target) target.scrollIntoView({ behavior: 'smooth' });
        });
    });

    // ========== 锚点平滑滚动 ==========
    document.querySelectorAll('a[href^="#"]').forEach(a => {
        a.addEventListener('click', e => {
            e.preventDefault();
            const t = document.querySelector(a.getAttribute('href'));
            if (t) t.scrollIntoView({ behavior: 'smooth' });
        });
    });

    // ========== 启动 ==========
    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(typeNext, 600);
    });
</script>
